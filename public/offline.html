<!DOCTYPE html>
<html lang="de" class="h-full">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>preppr – Offline</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #171717;
      --muted: #71717a;
      --border: #e4e4e7;
      --card-bg: #f4f4f5;
      --btn-bg: #18181b;
      --btn-fg: #fafafa;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #09090b;
        --fg: #fafafa;
        --muted: #a1a1aa;
        --border: #27272a;
        --card-bg: #18181b;
        --btn-bg: #fafafa;
        --btn-fg: #09090b;
      }
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
    .icon-container {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 1rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.75rem;
    }
    p {
      color: var(--muted);
      font-size: 0.9375rem;
      line-height: 1.5;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      background-color: var(--btn-bg);
      color: var(--btn-fg);
      font-weight: 600;
      font-size: 0.9375rem;
      padding: 0.875rem 1.25rem;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:hover {
      opacity: 0.9;
    }
    .badge {
      display: inline-block;
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-container">
      <svg width="40" height="40" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="9" height="44" rx="4.5" fill="currentColor"/>
        <path d="M22 10H42C48.0751 10 53 14.9249 53 19.5C53 20.3284 52.3284 21 51.5 21H22V10Z" fill="currentColor"/>
        <path d="M22 23.5H51.5C52.3284 23.5 53 24.1716 53 25C53 29.5751 48.0751 34.5 42 34.5H22V23.5Z" fill="currentColor"/>
        <circle cx="42.5" cy="22.25" r="3" fill="#10B981"/>
      </svg>
    </div>
    <h1>Du bist offline</h1>
    <p>
      Keine Internetverbindung verfügbar. Deine bereits geladenen Rezepte bleiben erhalten. Sobald du wieder Empfang hast, synchronisiert sich preppr automatisch.
    </p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
        <path d="M3 3v5h5"/>
        <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
        <path d="M16 21h5v-5"/>
      </svg>
      Erneut versuchen
    </button>
    <div class="badge">preppr PWA</div>
  </div>
</body>
</html>
